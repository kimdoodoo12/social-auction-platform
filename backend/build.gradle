plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.socialauction'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 의존성 ( dependencies ) { } 안에 프로젝트내 추가할 라이브러리 코드 -> 자동등록
	// Spring
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// 2. JDBC
	implementation 'org.springframework.boot:spring-boot-starter'
	runtimeOnly 'com.mysql:mysql-connector-j' // MySQL 사용 시

	// 3. 롬복
	compileOnly 'org.projectlombok:lombok'
  	annotationProcessor 'org.projectlombok:lombok'

	// 4. JPA / 하이버네이트 (ORM)구현체 
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// 5. HTTP 통신
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// 6. XML 파싱
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.22.2'

	// 7. CSV파싱
	implementation 'com.opencsv:opencsv:5.12.0'

	// 8. 로그인 관련 bcrypt
	implementation 'org.springframework.security:spring-security-crypto'

	// 9. JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
   	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
   	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// // 10. Redis 
	// implementation 'org.springframework.boot:spring-boot-starter-data-redis'
}

tasks.named('test') {
	useJUnitPlatform()
}